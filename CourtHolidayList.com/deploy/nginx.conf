# Reference Nginx config for courtholidaylist.com (static Vite dist + prerendered routes)
#
# Deploy: copy dist/ to /var/www/courtholidaylist/dist after `npm run build`
# SPA fallback serves /index.html for unknown client routes; prerendered
# paths like /delhi-high-court-holidays-2026/index.html are preferred.

# Redirect www → apex (optional but recommended for SEO)
server {
    listen 80;
    listen [::]:80;
    server_name www.courtholidaylist.com;
    return 301 https://courtholidaylist.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name courtholidaylist.com;

    # Prefer HTTPS in production (add ssl_certificate blocks / certbot)

    root /var/www/courtholidaylist/dist;
    index index.html;

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /robots.txt {
        access_log off;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        try_files $uri =404;
    }

    # Hashed Vite assets — long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Prerendered directories: /path → /path/index.html, else SPA shell
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
