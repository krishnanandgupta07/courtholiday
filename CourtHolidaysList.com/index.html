<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/CourtLiveLogo.jpeg" />
    <link rel="apple-touch-icon" href="/images/CourtLiveLogo.jpeg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a2744" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default title/description; react-helmet-async + prerender overwrite per route -->
    <title>Court Holidays Calendar | CourtHoliday</title>
    <meta
      name="description"
      content="Find court holidays in India for the Supreme Court, High Courts, District Courts and Tribunals."
    />
    <!-- Performance: preconnect to fonts + API -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.courtlivestream.com" />
    <link rel="dns-prefetch" href="https://api.courtlivestream.com" />
    <!-- Preload critical display font stylesheet -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MWJGB3LGTM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MWJGB3LGTM');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
